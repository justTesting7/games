<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%;
        background: radial-gradient(ellipse at 50% 30%, #1b2a33, #05080b 70%);
        color: #e8eef2;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 720px; margin: 0 auto; padding: 72px 24px 80px;
      }
      p.kicker {
        letter-spacing: 0.22em; text-transform: uppercase; font-size: 11px;
        opacity: 0.55; margin: 0 0 10px;
      }
      h1 { font-weight: 600; font-size: 42px; margin: 0 0 8px; }
      .sub { opacity: 0.7; margin: 0 0 36px; }
      a.game {
        display: block; text-decoration: none; color: inherit;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(8, 14, 18, 0.55);
        padding: 22px 24px; border-radius: 10px;
        transition: border-color 0.15s, background 0.15s;
      }
      a.game:hover { border-color: rgba(255,210,130,0.55); background: rgba(20, 28, 34, 0.8); }
      a.game strong { display: block; font-size: 22px; margin-bottom: 6px; }
      a.game span { opacity: 0.7; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">justTesting7</p>
      <h1>Games</h1>
      <p class="sub">Pick a title. More rooms will land here.</p>
      <a class="game" href="/shootout/">
        <strong>Shootout</strong>
        <span>Third-person fight · Relic Isle, Midtown, the Garden, Dizengoff Square</span>
      </a>
    </main>
  </body>
</html>
