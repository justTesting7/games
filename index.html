<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relic Isle</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="hitmarker"></div>
      <div id="score"><span id="targets">0</span><small>targets hit</small></div>
      <div id="weapon"><span id="ammo">∞</span><small>dual pistols</small></div>
      <div id="debug" class="hidden"></div>
    </div>

    <div id="menu">
      <div class="panel">
        <h1>Relic Isle</h1>
        <p class="sub">A third-person adventure on a photoreal island</p>
        <div id="loading">
          <div class="bar"><div id="loadbar"></div></div>
          <div id="loadlabel">Starting…</div>
        </div>
        <button id="play" class="hidden">Explore</button>
        <div class="settings">
          <label>Graphics
            <select id="quality">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high" selected>High</option>
              <option value="ultra">Ultra</option>
            </select>
          </label>
          <label>Time of day
            <input id="timeofday" type="range" min="0" max="1000" value="90" />
          </label>
          <label>Mouse sensitivity
            <input id="sens" type="range" min="1" max="20" value="8" />
          </label>
          <label>Volume
            <input id="volume" type="range" min="0" max="100" value="70" />
          </label>
        </div>
        <div class="controls">
          <div><b>WASD</b> move</div><div><b>Shift</b> sprint</div>
          <div><b>Space</b> jump</div><div><b>C</b> walk / jog toggle</div>
          <div><b>Right mouse</b> aim</div><div><b>Left mouse</b> fire</div>
          <div><b>T</b> (hold) fast-forward time</div><div><b>F3</b> stats · <b>Esc</b> menu</div>
        </div>
      </div>
    </div>

    <div id="error" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
